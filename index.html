<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="./css/style.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap');
  </style>

  <title>Frontend Mentor | Blog preview card</title>
</head>

<body>

  <main>
    <div class="card">
      <img class="mainImg" src="./assets/images/illustration-article.svg" alt="">
      <div class="content">
        <section class="middle">
          <span class="learning">Learning</span>
          <span class="date">Published 21 Dec 2023</span>
        </section>

        <section class="foundations">
          <h1 class="title">HTML & CSS foundations</h1>
          <p>
            These languages are the backbone of every website, defining structure, content, and presentation.
          </p>
        </section>
        <section class="author">
          <img src="./assets/images/image-avatar.webp" alt="">
          <span>Greg Hooper</span>
        </section>
      </div>
    </div>
  </main>

</body>

</html>
